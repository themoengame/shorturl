name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy otomatis via VPS poller
        run: |
          echo "Push terdeteksi. Deploy ke VPS ditangani oleh poller lokal"
          echo "(scripts/deploy-poll.sh via cron user moen, tiap 2 menit)."
