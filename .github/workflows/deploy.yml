name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          host_key: ${{ secrets.VPS_HOST_KEY }}
          env:
            VPS_ENV: ${{ secrets.VPS_ENV }}
          script: |
            set -e
            cd /home/moen/opencodeproject/shorturl
            [ -f .env ] || printf '%s\n' "$VPS_ENV" > .env
            git pull origin main
            docker compose up -d --build
            docker compose ps
            curl -s -o /dev/null -w "app HTTP %{http_code}\n" http://localhost:8090/ || true
