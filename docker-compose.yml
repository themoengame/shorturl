services:
  shorturl_app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: shorturl_app:latest
    container_name: shorturl_app
    restart: unless-stopped
    ports:
      - "8090:80"
    volumes:
      - ./:/var/www/html
      - ./docker/apache.conf:/etc/apache2/sites-enabled/000-default.conf:ro
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      APP_URL: ${APP_URL}
    depends_on:
      - shorturl_db
    networks:
      - public-net

  shorturl_db:
    image: mariadb:12.3.2
    container_name: shorturl_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS}
      TZ: Asia/Jakarta
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - shorturl_db_data:/var/lib/mysql
    ports:
      - "3308:3306"
    networks:
      - public-net

networks:
  public-net:
    external: true

volumes:
  shorturl_db_data:
